name: Store listings

# Separado de release.yml a proposito: la ficha se cambia muchas mas veces que la app, y no tiene
# ninguna razon para arrastrar un build de Gradle ni para gastar un versionCode.
on:
  workflow_dispatch:
  push:
    paths: ['store/listings/**']

jobs:
  listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # En un push solo se comprueban los limites: un texto pasado de largo se ve aqui y no en la
      # Console con el boton de guardar muerto y sin decir por que.
      - run: python tools/play-listing/subir.py

      - if: github.event_name == 'workflow_dispatch'
        run: pip install google-api-python-client google-auth

      # Solo a mano. Escribir la ficha es un cambio de cara al publico y el titulo ademas pasa por
      # revision de Play, asi que no se dispara solo al empujar a main.
      - if: github.event_name == 'workflow_dispatch'
        run: python tools/play-listing/subir.py --subir
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
