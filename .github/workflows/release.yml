name: Release to Play

# Tag driven on purpose: every push to main would burn a versionCode and spam the
# testers with a build nobody asked for. You tag when you mean to ship.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        type: choice
        options: [alpha, internal, beta, production]
        default: alpha

jobs:
  release:
    # La secuencia entera vive en BaltaJmn/ci porque Test4Test necesita la misma.
    # Los secretos se listan uno a uno y no con `secrets: inherit`: este repositorio
    # tambien guarda los de App Store Connect y no tienen nada que hacer aqui.
    uses: BaltaJmn/ci/.github/workflows/android-play-release.yml@main
    with:
      package-name: com.baltajmn.habit
      gradle-tasks: ':shared:testAndroidHostTest :androidApp:bundleRelease'
      track: ${{ inputs.track || 'alpha' }}
      whatsnew-dir: store/whatsnew
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
